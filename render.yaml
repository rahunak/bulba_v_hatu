services:
  - type: web
    name: veggie-bot
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_WHITELIST
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
